name: Build Scout APK

on:
  push:
    branches: [scout]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: checkout OsmAnd (this fork)
      uses: actions/checkout@v4
      with:
        path: android
    - name: checkout OsmAnd-resources
      uses: actions/checkout@v4
      with:
        repository: osmandapp/OsmAnd-resources
        path: resources
    - name: checkout OsmAnd-core
      uses: actions/checkout@v4
      with:
        repository: osmandapp/OsmAnd-core
        path: core
    - name: checkout OsmAnd-core-legacy
      uses: actions/checkout@v4
      with:
        repository: osmandapp/OsmAnd-core-legacy
        path: core-legacy
    - name: checkout OsmAnd-build
      uses: actions/checkout@v4
      with:
        repository: osmandapp/OsmAnd-build
        path: build
    - name: checkout OsmAnd-tools
      uses: actions/checkout@v4
      with:
        repository: osmandapp/OsmAnd-tools
        path: tools
    - name: checkout OsmAnd-misc
      uses: actions/checkout@v4
      with:
        repository: osmandapp/OsmAnd-misc
        path: misc

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Gradle cache
      uses: gradle/actions/setup-gradle@v4

    - name: Patch memory requirements
      working-directory: ./android
      run: printf "\norg.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8\n" >> gradle.properties

    - name: Build debug APK
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew assembleNightlyFreeLegacyFatDebug

    - name: Rename APK
      working-directory: ./android
      run: |
        d=OsmAnd/build/outputs/apk/nightlyFreeLegacyFat/debug
        mv $d/OsmAnd-nightlyFree-legacy-fat-debug.apk $d/OsmAnd-Scout-$(git log -n 1 --format='%h').apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: osmand-scout-apk
        path: android/OsmAnd/build/outputs/apk/*/*/*.apk
        retention-days: 30
